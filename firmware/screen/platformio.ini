; RaptHooker screen firmware: one source, a build per screen model (RH_MODEL). See README.md.

[platformio]
default_envs = sdpro, cyd

[common]
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.2.1
fonts =
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1

; GeekMagic-style "Smart weather clock" (stock firmware "SD Pro"): ESP8266, 4 MB flash, ST7789 240x240.
; The layout must stay eagle.flash.4m3m.ld, DIO, 40 MHz: the same as the stock firmware, so the stock
; LittleFS (and so the stock firmware itself) stays usable, and so every OTA lands where we expect.
[env:sdpro]
platform = espressif8266@4.2.1
framework = arduino
board = esp12e
board_build.ldscript = eagle.flash.4m3m.ld
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 160000000L
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps = ${common.lib_deps}
build_flags =
  -D NDEBUG
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_RGB_ORDER=1
  -D TFT_CS=15
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_SPI_MODE=SPI_MODE3
  -D SPI_FREQUENCY=40000000
  ${common.fonts}
  -D RH_BOARD_SDPRO=1
  -D RH_MODEL=\"sdpro-240\"
extra_scripts = post:tools/postbuild.py

; ESP32-2432S028 ("Cheap Yellow Display"): ESP32, 4 MB flash, 2.8" 320x240 ILI9341-type panel (the controller varies
; from batch to batch: see hw.h), XPT2046 touch. Installed over USB with partitions-esp32.csv, which then never
; changes: updates over the network have to fit app0/app1.
[env:cyd]
platform = espressif32@6.13.0
framework = arduino
board = esp32dev
board_build.partitions = partitions-esp32.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_speed = 115200
; The board's CH340 drops bytes at 460800.
upload_speed = 230400
lib_ldf_mode = deep+
lib_deps = ${common.lib_deps}
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D USE_HSPI_PORT=1
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000
  ${common.fonts}
  -D RH_BOARD_CYD=1
  -D RH_MODEL=\"esp32-2432s028\"
extra_scripts = post:tools/postbuild.py

; Not a release: firmware that crashes 20 s after it starts, to check on a board that an update that goes wrong is
; taken back (pio run -e cyd-crashtest, then send .pio/build/cyd-crashtest/firmware.bin to /api/ota).
[env:cyd-crashtest]
extends = env:cyd
build_flags =
  ${env:cyd.build_flags}
  -D RH_CRASH_TEST=1
extra_scripts =
