services:
  rapthooker:
    build: .
    image: rapthooker:latest
    container_name: rapthooker
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - ./docker-data:/data
      # Bluetooth: talk to the host's BlueZ over its system D-Bus.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    environment:
      - TZ=Etc/UTC
