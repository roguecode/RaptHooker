<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Lets members of the bluetooth group (the rapthooker service user) use BlueZ over the system bus: listening to
  adverts, discovery, and registering advertisement monitors for passive scanning
  (org.bluez.AdvertisementMonitorManager1 RegisterMonitor/UnregisterMonitor, which needs BlueZ's experimental
  features). Replies to BlueZ's calls are allowed by the system bus's default policy.
-->
<busconfig>
  <policy group="bluetooth">
    <allow send_destination="org.bluez"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.AdvertisementMonitorManager1"/>
    <allow send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
  <!--
    bluetoothd (root) calls back into RaptHooker's monitor objects: GetManagedObjects on the monitor application,
    then Activate, Release and DeviceFound on the monitor. BlueZ's own bluetooth.conf allows root these interfaces;
    they're repeated here in case an older one doesn't.
  -->
  <policy user="root">
    <allow send_interface="org.bluez.AdvertisementMonitor1"/>
    <allow send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
