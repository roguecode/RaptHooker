; RaptHooker screen firmware.
; The layout must stay eagle.flash.4m3m.ld, DIO, 40 MHz: the same as the stock firmware, so the stock
; LittleFS (and so the stock firmware itself) stays usable, and so every OTA lands where we expect.

[platformio]
default_envs = sdpro

[env]
platform = espressif8266@4.2.1
framework = arduino
board = esp12e
board_build.ldscript = eagle.flash.4m3m.ld
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 160000000L
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -D NDEBUG
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_RGB_ORDER=1
  -D TFT_CS=15
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_SPI_MODE=SPI_MODE3
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
extra_scripts = post:tools/postbuild.py

; GeekMagic-style "Smart weather clock" (stock firmware "SD Pro"): ESP8266, 4 MB flash, ST7789 240x240.
[env:sdpro]
build_flags =
  ${env.build_flags}
  -D RH_MODEL=\"sdpro-240\"
