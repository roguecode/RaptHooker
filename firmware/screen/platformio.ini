; RaptHooker screen firmware: one source, a build per screen model (RH_MODEL). See README.md.

[platformio]
default_envs = sdpro, cyd, sdc2

[common]
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.2.1
fonts =
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1

; GeekMagic-style "Smart weather clock" (stock firmware "SD Pro"): ESP8266, 4 MB flash, ST7789 240x240.
; The layout must stay eagle.flash.4m3m.ld, DIO, 40 MHz: the same as the stock firmware, so the stock
; LittleFS (and so the stock firmware itself) stays usable, and so every OTA lands where we expect.
[env:sdpro]
platform = espressif8266@4.2.1
framework = arduino
board = esp12e
board_build.ldscript = eagle.flash.4m3m.ld
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 160000000L
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps = ${common.lib_deps}
build_flags =
  -D NDEBUG
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_RGB_ORDER=1
  -D TFT_CS=15
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_SPI_MODE=SPI_MODE3
  -D SPI_FREQUENCY=40000000
  ${common.fonts}
  -D RH_BOARD_SDPRO=1
  -D RH_MODEL=\"sdpro-240\"
extra_scripts = post:tools/postbuild.py

; ESP32-2432S028 ("Cheap Yellow Display"): ESP32, 4 MB flash, 2.8" 320x240 ILI9341-type panel (the controller varies
; from batch to batch: see hw.h), XPT2046 touch. Installed over USB with partitions-esp32.csv, which then never
; changes: updates over the network have to fit app0/app1.
[env:cyd]
platform = espressif32@6.13.0
framework = arduino
board = esp32dev
board_build.partitions = partitions-esp32.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_speed = 115200
; The board's CH340 drops bytes at 460800.
upload_speed = 230400
lib_ldf_mode = deep+
lib_deps = ${common.lib_deps}
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D USE_HSPI_PORT=1
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000
  ${common.fonts}
  -D RH_BOARD_CYD=1
  -D RH_MODEL=\"esp32-2432s028\"
extra_scripts = post:tools/postbuild.py

; JUZIPi "SDC2" Smart weather clock (its update page wants files named SDC2...): ESP32-C2 with a 26 MHz crystal, 4 MB
; DIO flash, ST7789 240x240, and no USB data. Installed over the stock firmware's update page into the app slot the
; stock firmware isn't running from. Its layout (partitions-sdc2.csv) never changes, so every image has to fit its
; 0xC0000 app slots. There are no ready-made Arduino libraries for the C2: pioarduino builds them from ESP-IDF with
; these settings (the first build takes a while). The panel is driven through ESP-IDF's esp_lcd rather than TFT_eSPI,
; which has no ESP32-C2 support.
[env:sdc2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-c2-devkitm-1
board_build.partitions = partitions-sdc2.csv
board_build.flash_mode = dio
board_build.f_flash = 60000000L
board_upload.flash_size = 4MB
; Arduino 3's WiFi library needs its Network library found the default way. That doesn't evaluate #if's, so the
; libraries only other boards (or HTTPS) would use are left out by name.
lib_ldf_mode = chain
lib_ignore =
  TFT_eSPI
  NetworkClientSecure
lib_deps = bblanchon/ArduinoJson@7.2.1
; pioarduino changes options in place: picking another value of a choice means unsetting the one it had. To fit the
; stock firmware's update page (under 0xBF000 bytes), logging, assertion messages, C++ exceptions, core dumps, PPP and
; WPA3 are left out (the ESP8266 screens have never had WPA3 either: WPA2, and WPA2/WPA3 networks, it is). The build
; leaves the time and the git version out of the image, so it's reproducible like the others.
custom_sdkconfig =
  CONFIG_XTAL_FREQ_26=y
  CONFIG_XTAL_FREQ=26
  CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
  CONFIG_ESPTOOLPY_FLASHFREQ_60M=y
  CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
  CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
  CONFIG_COMPILER_OPTIMIZATION_SIZE=y
  CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
  '# CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE is not set'
  CONFIG_COMPILER_OPTIMIZATION_ASSERTION_LEVEL=1
  '# CONFIG_COMPILER_CXX_EXCEPTIONS is not set'
  CONFIG_LOG_DEFAULT_LEVEL_NONE=y
  '# CONFIG_LOG_DEFAULT_LEVEL_ERROR is not set'
  CONFIG_LOG_DEFAULT_LEVEL=0
  CONFIG_LOG_MAXIMUM_LEVEL=0
  CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=y
  '# CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH is not set'
  '# CONFIG_ESP_COREDUMP_ENABLE is not set'
  CONFIG_BT_ENABLED=n
  CONFIG_LWIP_IPV6=n
  '# CONFIG_LWIP_PPP_SUPPORT is not set'
  CONFIG_ESP_ERR_TO_NAME_LOOKUP=n
  CONFIG_MBEDTLS_USE_CRYPTO_ROM_IMPL=y
  '# CONFIG_ESP_WIFI_ENABLE_WPA3_SAE is not set'
  CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
  CONFIG_ESP_WIFI_SOFTAP_SAE_SUPPORT=n
  CONFIG_ESP_WIFI_ENABLE_WPA3_OWE_STA=n
  CONFIG_APP_REPRODUCIBLE_BUILD=y
  '# CONFIG_APP_COMPILE_TIME_DATE is not set'
  CONFIG_APP_EXCLUDE_PROJECT_VER_VAR=y
; Nothing here uses these, and leaving them out makes the build quicker.
custom_component_remove =
  espressif/esp_hosted
  espressif/esp_wifi_remote
  espressif/esp-dsp
  espressif/libsodium
  espressif/esp-modbus
  espressif/qrcode
  espressif/esp_insights
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/network_provisioning
  espressif/esp-zboss-lib
  espressif/esp-zigbee-lib
  espressif/esp_modem
  espressif/esp-sr
  chmorgan/esp-libhelix-mp3
build_flags =
  ; The ESP32-C2 is RV32IMC: no atomic or floating-point instructions. pioarduino's Arduino build script for it doesn't
  ; say so (the C3's does), so without this the core, the libraries and this firmware are built for the toolchain's
  ; default, rv32imafdc, and the first atomic (a web request) or float (JSON) is an illegal instruction. postbuild.py
  ; gives it to the linker too (for the C and C++ libraries built for it), and checks the image has none.
  -march=rv32imc_zicsr_zifencei
  -mabi=ilp32
  -D CORE_DEBUG_LEVEL=0
  -D HTTPCLIENT_NOSECURE=1
  -D RH_BOARD_SDC2=1
  -D RH_MODEL=\"sdc2-240\"
  ; ESP-IDF's panic handler keeps what a crash left for the next start (platform.cpp): there's no serial port to read
  ; its own report from.
  -Wl,--wrap=panic_arch_fill_info
  -Wl,--wrap=panic_soc_fill_info
  ; Arduino 3's core puts its compile time in the image (chip-debug-report.cpp): fixed, so the build is reproducible.
  -Wno-builtin-macro-redefined
  -D__DATE__=\"-\"
  -D__TIME__=\"-\"
extra_scripts = post:tools/postbuild.py

; Not a release: firmware that crashes 20 s after it starts, to check on a board that an update that goes wrong is
; taken back (pio run -e cyd-crashtest, then send .pio/build/cyd-crashtest/firmware.bin to /api/ota).
[env:cyd-crashtest]
extends = env:cyd
build_flags =
  ${env:cyd.build_flags}
  -D RH_CRASH_TEST=1
extra_scripts =
